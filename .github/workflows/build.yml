name: Build Play4Earnn APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Fresh Flutter App
        run: |
          flutter create --org com.play4earnn play_app
          mkdir -p play_app/android/app
          echo '${{ secrets.FIREBASE_JSON }}' > play_app/android/app/google-services.json

      - name: Get Dependencies
        run: |
          cd play_app
          flutter pub get

      - name: Build APK
        run: |
          cd play_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: play4earnn-app-release
          path: play_app/build/app/outputs/flutter-apk/app-release.apk
