name: Generate and Build Play4Earnn App

on:
  workflow_dispatch:

# GitHub 2026 ke naye Node 24 standard ko force karne ke liye global environments
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  actions: write

jobs:
  setup-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.12.1'
          channel: 'stable'

      - name: Get Dependencies
        run: |
          cd play_app
          flutter pub get

      - name: Build APK Release
        run: |
          cd play_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: play4earnn-app-release
          path: play_app/build/app/outputs/flutter-apk/app-release.apk
          
