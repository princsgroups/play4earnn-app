name: Flutter APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Official Version)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.1'
          cache: false

      - name: Install Dependencies
        # Hum direct play_app folder ke andar ghus kar hi command chalayenge
        working-directory: play_app
        run: |
          flutter pub cache clean --force
          flutter pub get

      - name: Build APK Release
        working-directory: play_app
        run: |
          flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: play_app/build/app/outputs/flutter-apk/app-release.apk

