name: Flutter APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and Set up Exact Flutter 3.24.1
        run: |
          cd $HOME
          wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.24.1-stable.tar.xz
          tar -xf flutter_linux_3.24.1-stable.tar.xz
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          echo "$HOME/flutter/bin/cache/dart-sdk/bin" >> $GITHUB_PATH

      - name: Verify Flutter Version
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter --version

      - name: Install Dependencies
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          if [ -d "play_app" ]; then
            cd play_app
          fi
          flutter pub get

      - name: Build APK Release
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          if [ -d "play_app" ]; then
            cd play_app
          fi
          flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            play_app/build/app/outputs/flutter-apk/app-release.apk
