name: Flutter APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Force Install Clean Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Hum yahan string explicit bypass dene ke liye 'any' cache ko disable kar rahe hain
          flutter-version: '3.24.1'
          cache: false

      - name: Clear Global and Pub Cache
        run: |
          flutter config --no-analytics
          if [ -d "play_app" ]; then
            cd play_app
          fi
          # System ko bolenge purana sub metadata delete kare
          rm -rf .dart_tool
          rm -f pubspec.lock

      - name: Install Dependencies
        run: |
          if [ -d "play_app" ]; then
            cd play_app
          fi
          # Forced resolution bina local locks check kiye
          flutter pub get

      - name: Build APK Release
        run: |
          if [ -d "play_app" ]; then
            cd play_app
          fi
          flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            play_app/build/app/outputs/flutter-apk/app-release.apk


