name: Flutter APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'  # ya latest stable

      - name: Flutter Doctor
        run: flutter doctor

      - name: Install Dependencies
        run: |
          if [ -d "play_app" ]; then
            cd play_app
          fi
          flutter pub get

      - name: Build APK Release
        run: |
          if [ -d "play_app" ]; then
            cd play_app
          fi
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            play_app/build/app/outputs/flutter-apk/app-release.apk
