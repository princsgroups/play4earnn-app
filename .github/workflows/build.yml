name: Flutter APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Official
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          # Agar version dikkat de raha hai, toh hum latest stable use karenge jo sabhi packages ko support karega
          flutter-version: '3.24.1'

      - name: Verify Flutter Info
        run: |
          flutter --version
          dart --version

      - name: Install Dependencies (Force Fix)
        run: |
          if [ -d "play_app" ]; then
            cd play_app
          fi
          # Purani kisi bhi local configuration ko bypass karne ke liye
          flutter pub cache clean --force
          flutter pub get --no-example

      - name: Build APK Release
        run: |
          if [ -d "play_app" ]; then
            cd play_app
          fi
          flutter build apk --release --no-pub

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            play_app/build/app/outputs/flutter-apk/app-release.apk

