name: Flutter APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Exact Flutter for Dart 3.12
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Is version ke andar exact Dart 3.12.x aata hai jo aapke app ko chahiye
          flutter-version: '3.16.9'

      - name: Install Dependencies
        run: |
          if [ -d "play_app" ]; then
            cd play_app
          fi
          flutter pub get

      - name: Build APK Release
        run: |
          if [ -d "play_app" ]; then
            cd play_app
          fi
          flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            play_app/build/app/outputs/flutter-apk/app-release.apk

